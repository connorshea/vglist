version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: daily
      time: "12:00"
    open-pull-requests-limit: 10
    target-branch: main
    assignees:
      - connorshea
    ignore:
      - dependency-name: aws-partitions
        versions: [">= 0"]
      - dependency-name: aws-sdk-core
        versions: [">= 0"]
      - dependency-name: aws-sdk-kms
        versions: [">= 0"]
      - dependency-name: aws-sdk-s3
        versions: [">= 0"]
    cooldown:
      default-days: 1
    # One PR for all minor/patch gem bumps. Majors still get their own PR
    # so a breaking upgrade can't hold the rest back.
    groups:
      bundler-minor-patch:
        update-types: [minor, patch]
      bundler-security:
        applies-to: security-updates
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "frontend/"
    schedule:
      interval: weekly
      time: "12:00"
    open-pull-requests-limit: 5
    target-branch: main
    assignees:
      - connorshea
    ignore:
      - dependency-name: "@types/lodash"
        versions: [">= 0"]
      - dependency-name: "@types/node"
        versions: [">= 0"]
      - dependency-name: "@sentry/browser"
        versions: [">= 0"]
      - dependency-name: "@sentry/integrations"
        versions: [">= 0"]
    cooldown:
      default-days: 3
    # A single group (rather than prod/dev groups) keeps every minor/patch
    # change to pnpm-lock.yaml in one PR. Separate PRs touching the same
    # transitive deps can merge cleanly yet leave duplicate lockfile keys
    # (see #5068). Majors still get their own PR.
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
      frontend-security:
        applies-to: security-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      time: "12:00"
    open-pull-requests-limit: 5
    target-branch: main
    assignees:
      - connorshea
    cooldown:
      default-days: 3
    # Actions are SHA-pinned, so bumps are mechanical; group majors too.
    groups:
      github-actions:
        patterns: ["*"]
  # Base images in Dockerfile and frontend/Dockerfile (pinned by digest).
  # A Ruby bump here must also update mise.toml, Gemfile and the CI
  # workflows' ruby-version.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: weekly
      time: "12:00"
    open-pull-requests-limit: 5
    target-branch: main
    assignees:
      - connorshea
    cooldown:
      default-days: 3
    # Ruby gets its own PR because any version bump needs manual follow-up
    # commits (see above), which would stall the shared group's rebases.
    # Dependabot assigns each update to the first group it matches.
    groups:
      docker-ruby:
        patterns: ["ruby"]
        update-types: [minor, patch]
      # One PR across both Dockerfiles for the remaining minor/patch/digest
      # bumps. Majors (e.g. a new Node line) stay separate since they need
      # manual follow-up elsewhere.
      docker-minor-patch:
        update-types: [minor, patch]
