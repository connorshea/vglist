name: Docker

# Builds the production images (root Dockerfile for the API,
# frontend/Dockerfile for the SPA) and smoke-tests that each one boots and
# answers /health.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vglist_docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/vglist_docker
      # Required in production (CORS origin); any value works for a smoke test.
      FRONTEND_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cache layers in the GitHub Actions cache so the slow `bundle install`
      # layer is reused whenever Gemfile.lock is unchanged.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          tags: vglist-api
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # The real production key isn't available here, so boot against a
      # throwaway credentials file generated by the image itself. The editor
      # is a no-op: Rails' generated template already has secret_key_base.
      - name: Generate throwaway production credentials
        env:
          EDITOR: "true"
        run: |
          mkdir -p "$RUNNER_TEMP/credentials"
          docker run --rm --user 0 \
            -v "$RUNNER_TEMP/credentials:/rails/config/credentials" \
            -e EDITOR -e FRONTEND_URL \
            vglist-api bin/rails credentials:edit --environment production
          sudo chmod -R a+r "$RUNNER_TEMP/credentials"
          echo "RAILS_MASTER_KEY=$(cat "$RUNNER_TEMP/credentials/production.key")" >> "$GITHUB_ENV"

      # Load structure.sql first (exercises psql in the image). Running
      # db:prepare on an empty database would also run db/seeds.rb, which is
      # dev-only (it needs database_cleaner and truncates every table). Then
      # run db:prepare as the pre-deploy step does against an existing DB.
      - name: Prepare database
        run: |
          docker run --rm --network host \
            -v "$RUNNER_TEMP/credentials:/rails/config/credentials:ro" \
            -e RAILS_MASTER_KEY -e DATABASE_URL -e FRONTEND_URL \
            vglist-api bundle exec rails db:schema:load
          docker run --rm --network host \
            -v "$RUNNER_TEMP/credentials:/rails/config/credentials:ro" \
            -e RAILS_MASTER_KEY -e DATABASE_URL -e FRONTEND_URL \
            vglist-api bundle exec rails db:prepare

      - name: Boot Puma and check /health
        run: |
          docker run -d --name api --network host \
            -v "$RUNNER_TEMP/credentials:/rails/config/credentials:ro" \
            -e RAILS_MASTER_KEY -e DATABASE_URL -e FRONTEND_URL -e PORT=3000 \
            vglist-api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      # config.load_defaults enables YJIT during boot, which silently does
      # nothing if the base image's Ruby was built without it.
      - name: Check YJIT is enabled after Rails boots
        run: |
          docker exec api bin/rails runner \
            'abort "YJIT is not enabled" unless defined?(RubyVM::YJIT) && RubyVM::YJIT.enabled?; puts RUBY_DESCRIPTION'

      - name: Check libvips is usable
        run: |
          docker run --rm vglist-api bundle exec ruby -rvips -e 'puts "libvips #{Vips.version_string}"'

      - name: Check `file` is installed (active_storage_validations needs it)
        run: |
          docker run --rm vglist-api file --version

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reuse the pnpm install layer when the lockfile is unchanged.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          tags: vglist-frontend
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Serve and check /health and SPA fallback
        run: |
          docker run -d --name frontend -p 8080:8080 vglist-frontend
          for _ in $(seq 1 15); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/games/1 | grep -q '<div id="app">'

      # Hashed bundles are cached forever; HTML (including the SPA fallback
      # for deep routes) must be revalidated; a missing hashed asset is a
      # 404 that must not be cached; unhashed public/ files get a short
      # max-age. See frontend/Caddyfile.
      - name: Check Cache-Control headers
        run: |
          set -euo pipefail
          cache_control() {
            curl -sS -o /dev/null -D - "http://127.0.0.1:8080$1" \
              | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2-
          }
          expect() {
            actual="$(cache_control "$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error::$1: expected Cache-Control '$2', got '$actual'"
              exit 1
            fi
            echo "$1 -> $actual"
          }
          expect_status() {
            actual="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1")"
            if [ "$actual" != "$2" ]; then
              echo "::error::$1: expected status $2, got $actual"
              exit 1
            fi
          }
          asset="$(curl -fsS http://127.0.0.1:8080/ | grep -o '/assets/[^"]*\.js' | head -n1)"
          expect "$asset" "public, max-age=31536000, immutable"
          expect / "no-cache"
          expect /index.html "no-cache"
          expect /games/1 "no-cache"
          expect_status /assets/does-not-exist.js 404
          expect /assets/does-not-exist.js "no-store"
          for path in "$asset" / /index.html /games/1 /site.webmanifest /favicon-32.png; do
            expect_status "$path" 200
          done
          expect /site.webmanifest "public, max-age=86400"
          expect /favicon-32.png "public, max-age=86400"

      # The report-only CSP allows index.html's inline <style> by hash, and
      # Vite minifies that block at build time, so editing it silently
      # breaks the hash. See frontend/Caddyfile.
      - name: Check CSP hash matches index.html's inline style
        run: |
          set -euo pipefail
          csp="$(curl -sS -o /dev/null -D - http://127.0.0.1:8080/ \
            | tr -d '\r' | grep -i '^content-security-policy-report-only:' | cut -d' ' -f2-)"
          if [ -z "$csp" ]; then
            echo "::error::No Content-Security-Policy-Report-Only header on /"
            exit 1
          fi
          hash="$(curl -fsS http://127.0.0.1:8080/ \
            | sed -n 's:.*<style>\(.*\)</style>.*:\1:p' | tr -d '\n' \
            | openssl dgst -sha256 -binary | openssl base64)"
          case "$csp" in
            *"'sha256-$hash'"*) echo "Inline style hash sha256-$hash is allowed" ;;
            *)
              echo "::error::index.html's inline <style> hashes to sha256-$hash, which the report-only CSP doesn't allow. Update style-src in frontend/Caddyfile."
              exit 1
              ;;
          esac
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/csp-report' --data '{}' http://127.0.0.1:8080/csp-report)"
          if [ "$status" != "204" ]; then
            echo "::error::/csp-report: expected status 204, got $status"
            exit 1
          fi
