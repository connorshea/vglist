name: Docker

# Builds the production images (root Dockerfile for the API,
# frontend/Dockerfile for the SPA) and smoke-tests that each one boots and
# answers /health.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: vglist_docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/vglist_docker
      # Required in production (CORS origin); any value works for a smoke test.
      FRONTEND_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t vglist-api .

      # The real production key isn't available here, so boot against a
      # throwaway credentials file generated by the image itself. The
      # "editor" appends encryption_service_salt, which EncryptionService
      # needs at eager-load time (Rails generates secret_key_base itself).
      - name: Generate throwaway production credentials
        env:
          EDITOR: >-
            sh -c 'echo "encryption_service_salt: ci-only-salt" >> "$1"' --
        run: |
          mkdir -p "$RUNNER_TEMP/credentials"
          docker run --rm --user 0 \
            -v "$RUNNER_TEMP/credentials:/rails/config/credentials" \
            -e EDITOR -e FRONTEND_URL \
            vglist-api bin/rails credentials:edit --environment production
          sudo chmod -R a+r "$RUNNER_TEMP/credentials"
          echo "RAILS_MASTER_KEY=$(cat "$RUNNER_TEMP/credentials/production.key")" >> "$GITHUB_ENV"

      # Load structure.sql first (exercises psql in the image). Running
      # db:prepare on an empty database would also run db/seeds.rb, which is
      # dev-only (it needs database_cleaner and truncates every table). Then
      # run db:prepare as the pre-deploy step does against an existing DB.
      - name: Prepare database
        run: |
          docker run --rm --network host \
            -v "$RUNNER_TEMP/credentials:/rails/config/credentials:ro" \
            -e RAILS_MASTER_KEY -e DATABASE_URL -e FRONTEND_URL \
            vglist-api bundle exec rails db:schema:load
          docker run --rm --network host \
            -v "$RUNNER_TEMP/credentials:/rails/config/credentials:ro" \
            -e RAILS_MASTER_KEY -e DATABASE_URL -e FRONTEND_URL \
            vglist-api bundle exec rails db:prepare

      - name: Boot Puma and check /health
        run: |
          docker run -d --name api --network host \
            -v "$RUNNER_TEMP/credentials:/rails/config/credentials:ro" \
            -e RAILS_MASTER_KEY -e DATABASE_URL -e FRONTEND_URL -e PORT=3000 \
            vglist-api
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs api
          exit 1

      - name: Check libvips is usable
        run: docker run --rm vglist-api ruby -rvips -e 'puts "libvips #{Vips.version_string}"'

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -f frontend/Dockerfile -t vglist-frontend .

      - name: Serve and check /health and SPA fallback
        run: |
          docker run -d --name frontend -p 8080:8080 vglist-frontend
          for _ in $(seq 1 15); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/health && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/games/1 | grep -q '<div id="app">'
