name: Deploy

# Deploys a commit's prebuilt images (pushed to GHCR by the Docker workflow)
# to DigitalOcean App Platform. Manual only: Actions > Deploy > Run workflow,
# or `gh workflow run deploy.yml` (add `-f ref=<sha>` to pick a commit, which
# also works as a rollback).
#
# It points api, migrate, update-stats and frontend at that commit's image
# digests and waits for the rollout; the migrate PRE_DEPLOY job runs first, as
# before. It starts from the live app spec, so the encrypted secret values
# there are kept and only the image digests change. Changes to .do/app.yaml
# itself still need `doctl apps update`.
#
# Setup (once): a `production` environment (Settings > Environments) limited
# to the main branch, holding DIGITALOCEAN_ACCESS_TOKEN: a DO API token with
# App Platform read + update access.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy. Its images must already be built by the Docker workflow.
        required: true
        default: main

permissions: {}

# One deploy at a time. A deploy that's already running finishes first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/connorshea/vglist-api
  FRONTEND_IMAGE: ghcr.io/connorshea/vglist-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    # app_action polls until the rollout ends and the app has a live URL, with
    # no limit of its own. Without this a stuck rollout holds the
    # deploy-production lock for GitHub's 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://vglist.co
    steps:
      - name: Resolve commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look up image digests
        id: digests
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          for name in api frontend; do
            if [ "$name" = api ]; then image="$API_IMAGE"; else image="$FRONTEND_IMAGE"; fi
            if ! digest="$(docker buildx imagetools inspect "$image:$SHA" --format '{{json .Manifest}}' | jq -er .digest)"; then
              echo "::error::No $image:$SHA image. Images are only pushed for commits on main; if this one just merged, wait for its Docker workflow run to finish."
              exit 1
            fi
            echo "$name=$digest" >> "$GITHUB_OUTPUT"
            echo "- $image@$digest" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Deploy to App Platform
        uses: digitalocean/app_action/deploy@cc55bc9b848d25f9c1c9f831cf843fbab3fbfb15 # v2.0.11
        env:
          IMAGE_DIGEST_API: ${{ steps.digests.outputs.api }}
          IMAGE_DIGEST_MIGRATE: ${{ steps.digests.outputs.api }}
          IMAGE_DIGEST_UPDATE_STATS: ${{ steps.digests.outputs.api }}
          IMAGE_DIGEST_FRONTEND: ${{ steps.digests.outputs.frontend }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_name: vglist
