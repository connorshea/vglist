# DigitalOcean App Platform spec for vglist.
#
# Components:
#   - api        Rails API (repo-root Dockerfile), served at api.vglist.co
#   - frontend   Vue SPA served by Caddy (frontend/Dockerfile), at vglist.co
#   - migrate    PRE_DEPLOY job: `rails db:migrate` before each API rollout
#   - update-stats  SCHEDULED job: daily `rake vglist:update:stats` (ported
#                   from the VPS crontab, 00:00 UTC)
#   - db         Existing managed PostgreSQL cluster, attached to the app
#
# Deploys: App Platform doesn't build anything. .github/workflows/docker.yml
# builds and tests both images, pushes them to GHCR (ghcr.io/connorshea/
# vglist-api and vglist-frontend, both public packages) on every push to
# main, and .github/workflows/deploy.yml deploys a commit's digests when run
# by hand. The `tag: main` below is only what an update from this file
# points at until the next deploy. The
# frontend's build-time vars (VITE_SENTRY_DSN, VITE_TURNSTILE_SITE_KEY) are
# repo secrets for the Docker workflow, and the commit SHA is baked into the API
# image.
#
# This file isn't read on deploy. Changes to it are applied by hand:
#   doctl apps spec validate .do/app.yaml
#   doctl apps create --spec .do/app.yaml          # first time
#   doctl apps update <app-id> --spec .do/app.yaml # later changes
#
# Applying this file redeploys: every component goes back to `tag: main`,
# the newest commit on main whose images were pushed, and the migrate job
# runs. That commit may not be the one that's live, and this path skips the
# Deploy workflow's CI check. So deploy main with the Deploy workflow first,
# or swap each `tag: main` for the live `digest:` values from
# `doctl apps spec get` before updating.
#
# Secrets: every `type: SECRET` env below is declared without a value so no
# credentials live in git. Set the values once in the control panel (App →
# Settings → component → Environment Variables). App Platform then stores
# them encrypted. Before running `doctl apps update` with this file, pull the
# live spec (`doctl apps spec get <app-id>`) and copy the encrypted `EV[...]`
# values in, otherwise the update would blank them.
#
# Single-instance caveat: Rails.cache is an in-process :memory_store
# (config/environments/production.rb), and Rack::Attack keeps its throttle
# counters in Rails.cache. Each Puma worker therefore has its own cache and
# its own counters, and so would each extra container. Keep the API at
# instance_count: 1. Scaling out (or tightening rate limits) needs a shared
# store first, e.g. a managed Valkey/Redis cluster wired to cache_store.

name: vglist
region: sfo

# Private networking to the database. The cluster vglist-postgres is in sfo3,
# the datacenter App Platform uses for `sfo`, and this is its VPC. Without it,
# the API reached the database over its public address (~3ms per query from
# the console, vs under 1ms expected in-VPC). The database firewall must allow
# the app (an `app:<id>` rule, or its VPC egress IP from the Networking tab).
# Can't be combined with dedicated egress IPs.
vpc:
  id: 1c2f97c1-7994-4a0e-b99e-4ce41ed97272

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: vglist.co
    type: PRIMARY
  - domain: api.vglist.co
    type: ALIAS
  # Only exists to be redirected to the apex by the first ingress rule.
  - domain: www.vglist.co
    type: ALIAS

ingress:
  rules:
    - match:
        authority:
          exact: www.vglist.co
        path:
          prefix: /
      redirect:
        authority: vglist.co
        redirect_code: 301
    - match:
        authority:
          exact: api.vglist.co
        path:
          prefix: /
      component:
        name: api
    - match:
        path:
          prefix: /
      component:
        name: frontend

databases:
  # Reuses the existing DO Managed Postgres cluster the VPS already talks to
  # (database vglist_production, user vglist). Cluster vglist-postgres,
  # PostgreSQL 18. App Platform
  # attaches it and adds the app to its trusted sources. The 1 GB plan allows
  # ~22 connections: the API uses 2 workers x 3 threads = 6, plus 1 per job.
  - name: db
    engine: PG
    version: "18"
    production: true
    cluster_name: vglist-postgres
    db_name: vglist_production
    db_user: vglist

services:
  - name: api
    # Prebuilt by .github/workflows/docker.yml, deployed by deploy.yml.
    image:
      registry_type: GHCR
      registry: connorshea
      repository: vglist-api
      tag: main
    http_port: 3000
    # 2 shared vCPUs / 4 GiB ($50/mo, was apps-s-1vcpu-2gb at $25/mo). On one
    # vCPU, the parallel GraphQL requests a page makes seemed to queue for CPU.
    instance_size_slug: apps-s-2vcpu-4gb
    # See the single-instance caveat at the top of this file.
    instance_count: 1
    # Puma answers /health within ~2s of starting in the Docker CI job, so
    # probe early and often instead of idling 20s first. App Platform holds
    # the old container until this passes, so every second here is deploy
    # time. Budget before failing is unchanged: 5 + 15 x 5 = 80s, same as
    # the old 20 + 6 x 10.
    health_check:
      http_path: /health
      initial_delay_seconds: 5
      period_seconds: 5
      timeout_seconds: 5
      failure_threshold: 15
    envs:
      - key: PORT
        value: "3000"
      # Two Puma workers (one per vCPU) x 3 threads = 6 DB connections, well
      # under the cluster's ~22.
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: API_HOST
        value: api.vglist.co
      - key: FRONTEND_URL
        value: https://vglist.co
      # App Platform puts its ingress in X-Forwarded-For and the client in
      # DO-Connecting-IP, so Rack::Attack must throttle by this header or
      # every visitor shares one set of counters. See rack_attack.rb.
      # With the api.vglist.co record DNS-only in Cloudflare, App Platform is
      # the first proxy and this header is the client.
      - key: CLIENT_IP_HEADER
        value: DO-Connecting-IP
      # Set to "true" when the api.vglist.co record is proxied (orange cloud),
      # e.g. so Cloudflare can cache GraphQL GETs. DO-Connecting-IP then holds
      # a Cloudflare edge IP shared by many visitors, so Rack::Attack uses
      # CF-Connecting-IP instead, but only for requests that really come from
      # a Cloudflare IP. Leave CLIENT_IP_HEADER as it is.
      - key: BEHIND_CLOUDFLARE
        value: "false"
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: RAILS_MASTER_KEY
        type: SECRET
      - key: SES_SMTP_USERNAME
        type: SECRET
      - key: SES_SMTP_PASSWORD
        type: SECRET
      - key: SENTRY_DSN_RAILS
        type: SECRET
      - key: STEAM_WEB_API_KEY
        type: SECRET
      - key: MOBYGAMES_API_KEY
        type: SECRET
      - key: TWITCH_CLIENT_ID
        type: SECRET
      - key: TWITCH_CLIENT_SECRET
        type: SECRET
      - key: WIKIDATA_CONTACT_EMAIL
        type: SECRET
      # Cloudflare R2 (Active Storage). R2_BUCKET and R2_PUBLIC_HOST default
      # to "vglist" and https://files.vglist.co in config/storage.yml.
      - key: R2_ENDPOINT
        type: SECRET
      - key: R2_ACCESS_KEY_ID
        type: SECRET
      - key: R2_SECRET_ACCESS_KEY
        type: SECRET
      # Cloudflare Turnstile secret key for sign-up bot checks (see
      # TurnstileVerifier). Set it together with the frontend's
      # VITE_TURNSTILE_SITE_KEY: with only this set, every sign-up fails.
      - key: TURNSTILE_SECRET_KEY
        type: SECRET

  - name: frontend
    # Prebuilt by .github/workflows/docker.yml, deployed by deploy.yml.
    image:
      registry_type: GHCR
      registry: connorshea
      repository: vglist-frontend
      tag: main
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    # Caddy is up almost instantly; probe every 5s rather than the default 10s.
    health_check:
      http_path: /health
      period_seconds: 5
    envs:
      - key: PORT
        value: "8080"
        scope: RUN_TIME
      # Used by the Caddyfile's CSP connect-src.
      - key: API_ORIGIN
        value: https://api.vglist.co
        scope: RUN_TIME
      # Origin of VITE_SENTRY_DSN's host (e.g. https://o123.ingest.us.sentry.io),
      # for the Caddyfile's report-only CSP connect-src. Not secret, but set in
      # the control panel so the org ID stays out of the repo.
      - key: SENTRY_INGEST_ORIGIN
        scope: RUN_TIME
        type: SECRET
      # Sentry's CSP report URL (Project settings > Security Headers), for
      # the Caddyfile's report-only CSP report-uri.
      - key: CSP_REPORT_URI
        scope: RUN_TIME
        type: SECRET

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    # Prebuilt by .github/workflows/docker.yml, deployed by deploy.yml.
    image:
      registry_type: GHCR
      registry: connorshea
      repository: vglist-api
      tag: main
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    # db:migrate, not db:prepare: on an empty database db:prepare would also
    # run db/seeds.rb, which is dev-only and truncates every table.
    run_command: bundle exec rails db:migrate
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: RAILS_MASTER_KEY
        type: SECRET
      - key: SENTRY_DSN_RAILS
        type: SECRET
      - key: FRONTEND_URL
        value: https://vglist.co
      - key: API_HOST
        value: api.vglist.co

  - name: update-stats
    kind: SCHEDULED
    schedule:
      cron: "0 0 * * *"
      time_zone: UTC
    # Prebuilt by .github/workflows/docker.yml, deployed by deploy.yml.
    image:
      registry_type: GHCR
      registry: connorshea
      repository: vglist-api
      tag: main
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    run_command: bundle exec rake vglist:update:stats
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: RAILS_MASTER_KEY
        type: SECRET
      - key: SENTRY_DSN_RAILS
        type: SECRET
      - key: FRONTEND_URL
        value: https://vglist.co
      - key: API_HOST
        value: api.vglist.co
