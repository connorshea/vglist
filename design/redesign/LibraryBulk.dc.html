<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library table, bulk edit</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vglist-tokens.css">
<link rel="stylesheet" href="ds/vglist/components/bundle.css">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="font-family: var(--font-sans);">
  <dc-import name="LibraryTable" preselect="{{ true }}" status-menu-open="{{ true }}" dark="{{dark}}" hint-size="100%,1200px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    return { dark: this.props.dark ?? false };
  }
}
</script>
</body>
</html>
