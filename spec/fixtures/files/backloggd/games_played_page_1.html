<!DOCTYPE html>
<!-- Approximation of a Backloggd games list page (backloggd.com/u/<name>/games/added/type:played/).
     Backloggd's bot protection blocked fetching a real copy, so this follows the markup
     other Backloggd scrapers rely on. Replace it with a saved copy of a real page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example's Played Games | Backloggd</title>
</head>
<body>
  <div id="game-lists">
    <div class="row mx-n1">
      <div class="col-cus-5 col-md-cus-8 col-lg-cus-10 px-1 mb-2 rating-hover">
        <div class="card mx-auto game-cover" game_id="14593">
          <a class="cover-link" href="/games/hollow-knight/"></a>
          <div class="overflow-wrapper">
            <img class="card-img height" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co93cr.jpg" alt="Hollow Knight">
          </div>
          <div class="game-text-centered">Hollow Knight</div>
        </div>
        <div class="row mx-0 star-ratings-static">
          <div class="stars-top" style="width:90%">★★★★★</div>
          <div class="stars-bottom">★★★★★</div>
        </div>
      </div>
      <div class="col-cus-5 col-md-cus-8 col-lg-cus-10 px-1 mb-2 rating-hover">
        <div class="card mx-auto game-cover" game_id="1942">
          <a class="cover-link" href="/games/the-witcher-3-wild-hunt/"></a>
          <div class="overflow-wrapper">
            <img class="card-img height" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co1wyy.jpg" alt="The Witcher 3: Wild Hunt">
          </div>
          <div class="game-text-centered">The Witcher 3: Wild Hunt</div>
        </div>
      </div>
      <div class="col-cus-5 col-md-cus-8 col-lg-cus-10 px-1 mb-2 rating-hover">
        <div class="card mx-auto game-cover" game_id="999999">
          <a class="cover-link" href="/games/some-obscure-game/"></a>
          <div class="overflow-wrapper">
            <img class="card-img height" src="https://images.igdb.com/igdb/image/upload/t_cover_big/nocover.png" alt="Some Obscure Game">
          </div>
          <div class="game-text-centered">Some Obscure Game</div>
        </div>
        <div class="row mx-0 star-ratings-static">
          <div class="stars-top" style="width:50%">★★★★★</div>
        </div>
      </div>
    </div>
  </div>
  <nav class="pagy-bootstrap-nav" aria-label="pager">
    <ul class="pagination">
      <li class="page-item active"><a class="page-link" href="#">1</a></li>
      <li class="page-item"><a class="page-link" href="/u/Example/games/added/type:played/?page=2">2</a></li>
      <li class="page-item next next-page"><a class="page-link" href="/u/Example/games/added/type:played/?page=2" rel="next">Next</a></li>
    </ul>
  </nav>
</body>
</html>
