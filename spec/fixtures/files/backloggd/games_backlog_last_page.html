<!DOCTYPE html>
<!-- Approximation of the last page of a Backloggd games list (backloggd.com/u/<name>/games/added/type:backlog/?page=2).
     Backloggd's bot protection blocked fetching a real copy, so this follows the markup
     other Backloggd scrapers rely on. Replace it with a copy of a real page. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example's Backlog | Backloggd</title>
</head>
<body>
  <div id="game-lists">
    <div class="rating-hover">
      <div class="card mx-auto game-cover" game_id="119133">
        <a class="cover-link" href="/games/elden-ring/"></a>
        <img class="card-img height" src="https://images.igdb.com/igdb/image/upload/t_cover_big/co4jni.jpg" alt="Elden Ring">
      </div>
    </div>
  </div>
  <nav class="pagy-bootstrap-nav" aria-label="pager">
    <ul class="pagination">
      <li class="page-item prev"><a class="page-link" href="/u/Example/games/added/type:backlog/?page=1" rel="prev">Previous</a></li>
      <li class="page-item"><a class="page-link" href="/u/Example/games/added/type:backlog/?page=1">1</a></li>
      <li class="page-item active"><a class="page-link" href="#">2</a></li>
      <li class="page-item next disabled"><a class="page-link">Next</a></li>
    </ul>
  </nav>
</body>
</html>
